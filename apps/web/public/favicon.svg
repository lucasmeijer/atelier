<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Atelier painting on an easel">
  <defs>
    <linearGradient id="bg" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="sky" x1="18" y1="13" x2="46" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="paint" x1="20" y1="21" x2="44" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb7185"/>
      <stop offset=".52" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e293b" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- wooden painting-holder / easel -->
  <g stroke="#7c3f1d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M32 12v43"/>
    <path d="M25 34 16 56"/>
    <path d="M39 34 48 56"/>
    <path d="M20 43h24"/>
  </g>
  <path d="M28 10h8" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>

  <!-- canvas -->
  <g filter="url(#shadow)">
    <rect x="14" y="13" width="36" height="29" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="2.5"/>
    <rect x="18" y="17" width="28" height="21" rx="2" fill="url(#sky)"/>
    <path d="M18 34c6-8 10-8 15-2 4-5 8-6 13 0v6H18z" fill="#166534" opacity=".9"/>
    <circle cx="39" cy="22" r="4" fill="#fde68a"/>
    <path d="M22 28c5-8 12-5 11 4 4-5 8-4 10 2" stroke="url(#paint)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- tiny paint dab for icon personality -->
  <circle cx="50" cy="48" r="4" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
</svg>
