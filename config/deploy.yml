# Kamal deployment for Atelier.
# Cloudflare terminates public HTTPS and Cloudflare Access protects the app.
service: atelier
image: atelier-web

servers:
  web:
    hosts:
      - 78.47.191.121
    options:
      # Fallback host gateway name for Docker-on-Linux deployments.
      add-host: host.docker.internal:host-gateway
      # Stable DNS alias; Atelier detects this at runtime for workspace egress proxying.
      network-alias: atelier-web

proxy:
  app_port: 3000
  ssl: false
  response_timeout: 3600
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  # Kamal 2.11 starts a temporary/local registry and uses SSH forwarding.
  server: localhost:5555

builder:
  arch: amd64
  # Building amd64 images locally on Apple Silicon goes through QEMU and makes
  # `kamal deploy` crawl. Build natively on the amd64 deployment host instead.
  remote: ssh://root@78.47.191.121
  context: .
  dockerfile: apps/web/Dockerfile
  args:
    ATELIER_COMMIT_ID: <%= `git rev-parse HEAD`.strip.dump %>
    ATELIER_COMMIT_DESCRIPTION: <%= `git log -1 --pretty=%s`.strip.dump %>

ssh:
  user: root

env:
  clear:
    HOST: 0.0.0.0
    PORT: 3000
    ATELIER_WORKSPACE_IMAGE: ghcr.io/lucasmeijer/atelier-workspace:latest
  secret:
    - ATELIER_PASSWORD
    - ATELIER_AUTH_SECRET

volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  - /var/lib/atelier:/storage
