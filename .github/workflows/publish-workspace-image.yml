name: Publish default workspace image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-workspace-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate the default workspace image and its signature
        id: image
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/workspace-image"
          bun packages/workspace-image/scripts/build-context.mjs "$context"
          tag=$(jq -er '.tag | select(startswith("atelier-workspace:")) | ltrimstr("atelier-workspace:")' "$context/metadata.json")
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atelier-workspace"
          {
            echo "context=$context"
            echo "ref=$repository:$tag"
            echo "alias=$repository:latest-main"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for the signature in the registry
        id: registry
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" --raw > manifest.json 2> inspect-error.txt; then
            # A previous single-platform publication is not a complete cache hit.
            if jq -e '[.manifests[]?.platform | .os + "/" + .architecture] | contains(["linux/amd64", "linux/arm64"])' manifest.json; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -Eqi 'manifest unknown|not found' inspect-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat inspect-error.txt >&2
            exit 1
          fi

      - name: Build and push the missing signature
        if: steps.registry.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            com.atelier.workspace-image.kind=default
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point latest-main at the signature without rebuilding
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          ALIAS: ${{ steps.image.outputs.alias }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          if docker buildx imagetools inspect "$ALIAS" --format '{{json .Manifest}}' > alias.json 2> inspect-error.txt; then
            if [ "$(jq -er '.digest' alias.json)" = "$digest" ]; then
              echo "$ALIAS already points at $IMAGE; nothing to do."
              exit 0
            fi
          elif ! grep -Eqi 'manifest unknown|not found' inspect-error.txt; then
            cat inspect-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$ALIAS" "$IMAGE@$digest"
          echo "Published $IMAGE and $ALIAS" >> "$GITHUB_STEP_SUMMARY"
