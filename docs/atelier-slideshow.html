<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier Talk Slideshow</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2e3440;
      --panel: #333a47;
      --elev: #3b4252;
      --line: #414a5b;
      --line-2: #4c566a;
      --text: #eceff4;
      --muted: #c4ccd9;
      --muted-2: #7b889e;
      --accent: #88c0d0;
      --accent-soft: rgba(136,192,208,.16);
      --red: #bf616a;
      --shadow: 0 22px 56px rgba(0,0,0,.45);
      --sans: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 18%, rgba(136, 192, 208, 0.11), transparent 32rem),
        radial-gradient(circle at 82% 74%, rgba(180, 142, 173, 0.10), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    main {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 8vh 8vw;
      opacity: 0;
      transform: translateX(4vw);
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .stage {
      width: min(1200px, 100%);
      min-height: 72vh;
      display: grid;
      grid-template-rows: minmax(9rem, auto) 1fr;
      align-content: center;
      gap: clamp(1.2rem, 3vh, 2.8rem);
      padding: clamp(1.4rem, 3vw, 3rem);
    }

    .history {
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 0.45rem;
    }

    .history-row {
      color: var(--muted);
      opacity: 0;
      transform: translate3d(0, 0.7rem, 0);
      font-size: clamp(1.45rem, 2.6vw, 2.8rem);
      font-weight: 650;
      letter-spacing: -0.018em;
      line-height: 1.12;
      animation: settle 280ms ease forwards;
    }

    .current-wrap {
      display: flex;
      align-items: start;
      min-height: 18rem;
    }

    .current-text {
      color: var(--text);
      font-size: clamp(3.4rem, 7.2vw, 7.9rem);
      font-weight: 720;
      letter-spacing: -0.025em;
      line-height: 1.02;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
      max-width: 100%;
      will-change: transform, opacity;
    }

    .current-text::before {
      content: "";
      display: inline-block;
      width: 0.16em;
      height: 0.16em;
      margin-right: 0.22em;
      vertical-align: 0.18em;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 8px var(--accent-soft);
    }

    .current-text:empty::before { display: none; }

    .current-text.entering {
      animation: spotlight 360ms cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes spotlight {
      from { opacity: 0; transform: translate3d(0, 0.9rem, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes settle {
      to { opacity: 0.48; transform: translate3d(0, 0, 0); }
    }

    .slide[data-slide="url"] {
      padding: 0;
    }

    .url {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      font-size: clamp(2.6rem, 6.5vw, 7.4rem);
      font-weight: 760;
      letter-spacing: -0.025em;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .hint {
      position: fixed;
      right: 2rem;
      bottom: 1.6rem;
      color: var(--muted-2);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <section class="slide active" data-slide="problems" aria-label="Problems">
      <div class="stage">
        <div class="history" id="history"></div>
        <div class="current-wrap">
          <div class="current-text" id="currentText"></div>
        </div>
      </div>
    </section>

    <section class="slide" data-slide="url" aria-label="Atelier URL">
      <div class="url">lucasmeijer.com/atelier</div>
    </section>
  </main>

  <div class="hint">← / →</div>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const history = document.querySelector('#history');
    const currentText = document.querySelector('#currentText');
    const items = [
      'Terminal :-(',
      'Endless window soup',
      'Many clicks/steps to look at agent results',
      'Starting new task takes many seconds',
      'Stops when laptop closes',
      'Access to all my life + work keys',
    ];
    let slide = 0;
    let revealed = 0;
    let lastCurrent = '';
    let lastHistoryKey = '';

    function render() {
      slides.forEach((el, i) => el.classList.toggle('active', i === slide));

      const previousItems = items.slice(0, Math.max(0, revealed - 1));
      const historyKey = previousItems.join('\n');
      if (historyKey !== lastHistoryKey) {
        history.replaceChildren(...previousItems.map((text) => {
          const row = document.createElement('div');
          row.className = 'history-row';
          row.textContent = text;
          return row;
        }));
        lastHistoryKey = historyKey;
      }

      const nextCurrent = revealed > 0 ? items[revealed - 1] : '';
      if (nextCurrent !== lastCurrent) {
        currentText.textContent = nextCurrent;
        currentText.classList.remove('entering');
        void currentText.offsetWidth;
        currentText.classList.toggle('entering', nextCurrent !== '');
        lastCurrent = nextCurrent;
      }
    }

    function next() {
      if (slide === 0 && revealed < items.length) revealed += 1;
      else if (slide < slides.length - 1) slide += 1;
      render();
    }

    function previous() {
      if (slide > 0) slide -= 1;
      else if (revealed > 0) revealed -= 1;
      render();
    }

    addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'PageDown') next();
      if (event.key === 'ArrowLeft' || event.key === 'PageUp' || event.key === 'Backspace') previous();
    });

    addEventListener('click', next);
    render();
  </script>
</body>
</html>
